spring:
  application:
    name: weather-service-a

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  liquibase:
    enabled: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

  kafka:
    bootstrap-servers: host.minikube.internal:29092
    consumer:
      group-id: weather-consumer
      properties:
        allow.auto.create.topics: true
    producer:
      properties:
        allow.auto.create.topics: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  address: 0.0.0.0

grpc:
  client:
    weather-service-b:
      address: static://${GRPC_SERVICE_B_HOST:localhost}:${GRPC_SERVICE_B_PORT:9090}
      negotiation-type: plaintext

logging:
  level:
    root: INFO
    task1: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:pdf-documents}
  region: ${MINIO_REGION:us-east-1}